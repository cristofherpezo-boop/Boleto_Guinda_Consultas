<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consulta de Boletos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fdf6e3;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      padding: 0 0 40px;
    }
    .pg-header {
      background: #6B1010;
      padding: 12px 24px 18px;
      text-align: center;
      border-bottom: 4px solid #8B0000;
    }
    .pg-header-sup {
      font-size: 10px;
      letter-spacing: 3px;
      color: #f5c5c5;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .pg-header h1 {
      font-size: 1.6rem;
      color: #fff;
      font-family: Georgia, serif;
      font-weight: 700;
      margin: 0;
    }
    .pg-wrap {
      max-width: 460px;
      margin: 0 auto;
      padding: 28px 20px 0;
    }
    .pg-greeting {
      font-size: 1.3rem;
      font-family: Georgia, serif;
      color: #6B1010;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .pg-sub {
      font-size: 0.92rem;
      color: #555;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .pg-input {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #d4b8a0;
      border-radius: 10px;
      font-size: 1.1rem;
      outline: none;
      text-align: center;
      letter-spacing: 2px;
      background: #fff8ee;
      color: #3a1a1a;
      font-family: 'Segoe UI', sans-serif;
    }
    .pg-input:focus { border-color: #8B1010; }
    .pg-btn {
      margin-top: 14px;
      width: 100%;
      padding: 14px;
      background: #7B0F0F;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .pg-btn:hover { background: #5e0a0a; }
    .pg-btn:disabled { background: #c4857e; cursor: not-allowed; }
    .pg-result { margin-top: 28px; display: none; }
    .pg-nombre-box {
      background: #7B0F0F;
      border-radius: 12px;
      padding: 16px 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .pg-nombre-label {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f5c5c5;
      margin-bottom: 4px;
    }
    .pg-nombre-valor {
      font-size: 1.3rem;
      font-family: Georgia, serif;
      color: #fff;
      font-weight: 700;
    }
    .pg-section-title {
      font-family: Georgia, serif;
      color: #6B1010;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .pg-total-badge {
      background: #fff8ee;
      border: 1px solid #d4b8a0;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: #555;
    }
    .pg-total-badge span:last-child {
      font-size: 1.1rem;
      font-weight: 700;
      color: #7B0F0F;
    }
    .pg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 10px;
    }
    .pg-chip {
      background: #fff8ee;
      border: 1px solid #c9a07a;
      border-radius: 10px;
      padding: 12px 6px;
      text-align: center;
    }
    .pg-chip-label {
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #8B4513;
      display: block;
      margin-bottom: 3px;
    }
    .pg-chip-num {
      font-size: 1.2rem;
      font-weight: 700;
      color: #6B1010;
      font-family: Georgia, serif;
    }
    .pg-error-box {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .pg-error-titulo { font-size: 1rem; font-weight: 700; color: #be123c; margin-bottom: 4px; }
    .pg-error-sub { font-size: 0.88rem; color: #888; }
    .pg-footer {
      background: #7B0F0F;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      color: #fff;
      font-size: 0.9rem;
      margin-top: 28px;
      font-family: Georgia, serif;
    }
  </style>
</head>
<body>
  <div class="pg-header">
    <div class="pg-header-sup">El Sentimiento Guinda</div>
    <h1>🎟️ Consulta tus Boletos</h1>
  </div>

  <div class="pg-wrap">
    <p class="pg-greeting">¡Hola! 👋</p>
    <p class="pg-sub">Ingresa tu DNI para ver los números de boleto registrados a tu nombre.</p>

    <input class="pg-input" type="text" id="dniInput" placeholder="Ej: 12345678" maxlength="15" inputmode="numeric"/>
    <button class="pg-btn" id="btnConsultar" onclick="consultar()">Consultar</button>

    <div class="pg-result" id="resultado"></div>
  </div>

  <script>
    const FLOW_URL = "/api/proxy";

    function renderExito(data) {
      const nombre = data.boletos[0].Nombrecompleto || "—";
      const chips = data.boletos.map(b => `
        <div class="pg-chip">
          <span class="pg-chip-label">N° boleto</span>
          <span class="pg-chip-num">${b.ID}</span>
        </div>
      `).join("");
      return `
        <div class="pg-nombre-box">
          <div class="pg-nombre-label">Participante</div>
          <div class="pg-nombre-valor">${nombre}</div>
        </div>
        <p class="pg-section-title">🎫 Tus números de boleto</p>
        <div class="pg-total-badge">
          <span>Cantidad de boletos</span>
          <span>${data.totalBoletos}</span>
        </div>
        <div class="pg-grid">${chips}</div>
        <div class="pg-footer">¡Mucha suerte en la rifa! 🍀🔥</div>
      `;
    }

    function renderError(msg, sub) {
      return `<div class="pg-error-box"><div class="pg-error-titulo">${msg}</div><div class="pg-error-sub">${sub}</div></div>`;
    }

    async function consultar() {
      const dni = document.getElementById("dniInput").value.trim();
      const btn = document.getElementById("btnConsultar");
      const resultado = document.getElementById("resultado");
      if (!dni) { alert("Por favor ingresa tu DNI"); return; }
      btn.disabled = true;
      btn.textContent = "Consultando...";
      resultado.style.display = "none";
      try {
        const response = await fetch(FLOW_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ dni })
        });
        if (!response.ok) throw new Error();
        const data = await response.json();
        resultado.style.display = "block";
        resultado.innerHTML = data.totalBoletos > 0
          ? renderExito(data)
          : renderError("No encontrado", "No hay boletos registrados con este DNI");
      } catch {
        resultado.style.display = "block";
        resultado.innerHTML = renderError("Error de conexión", "No se pudo conectar. Intenta nuevamente.");
      }
      btn.disabled = false;
      btn.textContent = "Consultar";
    }

    document.getElementById("dniInput").addEventListener("keypress", e => {
      if (e.key === "Enter") consultar();
    });
  </script>
</body>
</html>
