<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consulta de Boletos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 { font-size: 1.5rem; color: #1a1a2e; margin-bottom: 8px; }
    p.sub { color: #666; font-size: 0.95rem; margin-bottom: 28px; }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1.1rem;
      outline: none;
      transition: border 0.2s;
      text-align: center;
      letter-spacing: 2px;
    }
    input:focus { border-color: #4f46e5; }
    button {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    .resultado {
      margin-top: 28px;
      padding: 20px;
      border-radius: 12px;
      display: none;
      text-align: left;
    }
    .resultado.exito { background: #f5f3ff; border: 1px solid #c4b5fd; }
    .resultado.error { background: #fff1f2; border: 1px solid #fecdd3; }
    .nombre-label { font-size: 0.8rem; color: #888; margin-bottom: 2px; }
    .nombre-valor { font-size: 1rem; font-weight: 600; color: #1a1a2e; margin-bottom: 16px; }
    .total-texto { font-size: 0.9rem; color: #555; margin-bottom: 12px; }
    .total-texto span { font-weight: 700; color: #4f46e5; }
    .grid-boletos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 8px;
    }
    .boleto-chip {
      background: #ede9fe;
      border: 1px solid #c4b5fd;
      border-radius: 8px;
      padding: 10px 6px;
      text-align: center;
    }
    .boleto-chip .chip-label { font-size: 9px; color: #6d28d9; display: block; margin-bottom: 2px; }
    .boleto-chip .chip-num { font-size: 1.1rem; font-weight: 700; color: #4c1d95; }
    .error-titulo { font-size: 1.1rem; font-weight: 600; color: #e11d48; margin-bottom: 4px; }
    .error-sub { font-size: 0.9rem; color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎟️ Consulta tus Boletos</h1>
    <p class="sub">Ingresa tu DNI para ver tus números de boleto</p>
    <input type="text" id="dniInput" placeholder="Ej: 12345678" maxlength="15" inputmode="numeric"/>
    <button id="btnConsultar" onclick="consultar()">Consultar</button>
    <div class="resultado" id="resultado"></div>
  </div>

  <script>
    const FLOW_URL = "/api/proxy";

    async function consultar() {
      const dni = document.getElementById("dniInput").value.trim();
      const btn = document.getElementById("btnConsultar");
      const resultado = document.getElementById("resultado");

      if (!dni) { alert("Por favor ingresa tu DNI"); return; }

      btn.disabled = true;
      btn.textContent = "Consultando...";
      resultado.style.display = "none";

      try {
        const response = await fetch(FLOW_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ dni: dni })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        resultado.style.display = "block";

        if (data.totalBoletos > 0) {
          resultado.className = "resultado exito";
          const nombre = data.boletos[0].Nombrecompleto || "—";
          const chips = data.boletos.map(b => `
            <div class="boleto-chip">
              <span class="chip-label">N° boleto</span>
              <span class="chip-num">${b.ID}</span>
            </div>
          `).join("");

          resultado.innerHTML = `
            <div class="nombre-label">Nombre</div>
            <div class="nombre-valor">${nombre}</div>
            <div class="total-texto">Tienes <span>${data.totalBoletos}</span> boleto${data.totalBoletos === 1 ? "" : "s"} registrado${data.totalBoletos === 1 ? "" : "s"}</div>
            <div class="grid-boletos">${chips}</div>
          `;
        } else {
          resultado.className = "resultado error";
          resultado.innerHTML = `
            <div class="error-titulo">No encontrado</div>
            <div class="error-sub">No hay boletos registrados con este DNI</div>
          `;
        }
      } catch (err) {
        resultado.className = "resultado error";
        resultado.style.display = "block";
        resultado.innerHTML = `
          <div class="error-titulo">Error de conexión</div>
          <div class="error-sub">No se pudo conectar. Intenta nuevamente.</div>
        `;
        console.error(err);
      }

      btn.disabled = false;
      btn.textContent = "Consultar";
    }

    document.getElementById("dniInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") consultar();
    });
  </script>
</body>
</html>
