<script>
    // Asegúrate de reemplazar esta URL con tu link real de Power Automate (HTTP POST URL)
    const FLOW_URL = "TU_URL_DE_POWER_AUTOMATE_AQUÍ";

    async function consultar() {
      const dniInput = document.getElementById("dniInput");
      const dni = dniInput.value.trim();
      const btn = document.getElementById("btnConsultar");
      const resultadoError = document.getElementById("resultadoError");
      const resultadoExito = document.getElementById("resultadoExito");
      
      if (!dni) { 
        alert("Por favor ingresa tu DNI"); 
        return; 
      }

      // Reset de interfaz
      resultadoError.style.display = "none";
      resultadoExito.style.display = "none";
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-dots">Consultando</span>';

      try {
        const response = await fetch(FLOW_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ dni: dni })
        });

        if (!response.ok) throw new Error("Error en la respuesta del servidor");

        const data = await response.json();

        // VALIDACIÓN: Power Automate a veces devuelve los datos dentro de 'body' o directo en la raíz
        const listaBoletos = data.boletos || data; 
        const total = data.totalBoletos || (Array.isArray(listaBoletos) ? listaBoletos.length : 0);

        if (total > 0 && Array.isArray(listaBoletos)) {
          // Extraer nombre del primer registro
          const primerRegistro = listaBoletos[0];
          const nombre = primerRegistro.Nombre_completo || primerRegistro.Nombre || "Comprador";
          
          document.getElementById("exitoNombre").textContent = nombre;
          document.getElementById("exitoCount").textContent = 
            total === 1 ? "1 boleto registrado" : total + " boletos registrados";

          const grid = document.getElementById("ticketsGrid");
          grid.innerHTML = "";

          listaBoletos.forEach((boleto, i) => {
            // Intentar obtener el ID de varias fuentes comunes de SharePoint/Excel
            const ticketID = boleto.ID_Ticket || boleto.ID || boleto.Title || "---";
            
            const div = document.createElement("div");
            div.className = "ticket-item";
            div.style.animationDelay = (i * 0.08) + "s";
            div.innerHTML = `
              <div class="ticket-lbl">Boleto</div>
              <div class="ticket-num">${ticketID}</div>
            `;
            grid.appendChild(div);
          });

          resultadoExito.style.display = "block";
        } else {
          mostrarError("Sin boletos", "No hay boletos validados con este DNI.");
        }
      } catch (err) {
        console.error("Error detallado:", err);
        mostrarError("Error de conexión", "No logramos conectar con el sistema. Revisa tu internet.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Verificar mis boletos";
      }
    }

    function mostrarError(titulo, sub) {
      document.getElementById("msgPrincipal").textContent = titulo;
      document.getElementById("msgSub").textContent = sub;
      document.getElementById("resultadoError").style.display = "block";
    }

    document.getElementById("dniInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") consultar();
    });
</script>
